    - generic [ref=e108]: El riesgo más importante
    - generic [ref=e109]: Cómo evitar que Claude alucine
    - generic [ref=e110]: En el sector contable, una alucinación no es un error de redacción. Puede ser un número de resolución inventado, un criterio fiscal incorrecto o una fecha que no existe. Esto es lo que tenés que saber.
    - paragraph [ref=e112]:
      - strong [ref=e113]: ¿Qué es una alucinación en este contexto?
      - text: Claude genera texto plausible, no verdadero. Puede inventar el número de una resolución AFIP que suena real pero no existe, citar un artículo de la ley con el número equivocado, o afirmar un criterio impositivo que fue actualizado y él no sabe. Esto no es un bug — es cómo funciona el modelo. Tu trabajo es saberlo y trabajar en consecuencia.
